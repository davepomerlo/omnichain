name: Build OmniChain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version tag (e.g. v1.1). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write   # needed to publish a Release when a v* tag is pushed

jobs:
  dsp-tests:
    name: DSP stress test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Get NAM core + Eigen
        shell: bash
        run: |
          git clone --depth 1 --branch v0.6.0 https://github.com/sdatkinson/NeuralAmpModelerCore.git ThirdParty/NeuralAmpModelerCore
          git clone --depth 1 --branch 3.4.1 https://gitlab.com/libeigen/eigen.git ThirdParty/eigen
      - name: Build and run engine test (incl. convolver + NAM)
        run: |
          N=ThirdParty/NeuralAmpModelerCore
          g++ -std=c++20 -O2 -DNAM_SAMPLE_FLOAT -I$N -IThirdParty/eigen -I$N/Dependencies/nlohmann \
              tests/EngineTest.cpp Source/dsp/*.cpp $(find $N/NAM -name '*.cpp') -o enginetest
          ./enginetest $N/example_models/wavenet.nam $N/example_models/lstm.nam

  windows:
    name: Windows VST3 + Standalone (MSVC)
    runs-on: windows-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v5

      - name: Get JUCE 7.0.12
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git JUCE
      - name: Get NAM core + Eigen
        shell: bash
        run: |
          git clone --depth 1 --branch v0.6.0 https://github.com/sdatkinson/NeuralAmpModelerCore.git ThirdParty/NeuralAmpModelerCore
          git clone --depth 1 --branch 3.4.1 https://gitlab.com/libeigen/eigen.git ThirdParty/eigen

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target OmniChain_VST3 OmniChain_Standalone --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "OmniChain-Windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "build/OmniChain_artefacts/Release/VST3/OmniChain.vst3" "$out/"
          Copy-Item "build/OmniChain_artefacts/Release/Standalone/OmniChain.exe" "$out/"
          Copy-Item "README.md" "$out/"
          Compress-Archive -Path $out -DestinationPath "OmniChain-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniChain-Windows
          path: OmniChain-Windows

      - name: Publish release (v* tag push, or manual run with a version)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: OmniChain ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: OmniChain-Windows.zip
          generate_release_notes: true
